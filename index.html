<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Valentine Paathu ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    background:linear-gradient(135deg,#ff4e88,#ff99ac);
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    color:white;
}

/* Floating Hearts */
.heart{
    position:absolute;
    bottom:-50px;
    width:20px;
    height:20px;
    background:red;
    transform:rotate(45deg);
    animation:float 8s infinite ease-in;
}

.heart::before,
.heart::after{
    content:'';
    position:absolute;
    width:20px;
    height:20px;
    background:red;
    border-radius:50%;
}

.heart::before{ top:-10px; left:0; }
.heart::after{ left:-10px; top:0; }

@keyframes float{
    0%{ transform:translateY(0) rotate(45deg); opacity:1;}
    100%{ transform:translateY(-110vh) rotate(45deg); opacity:0;}
}

/* Main Card */
.card{
    text-align:center;
    z-index:10;
    animation:fadeIn 2s ease forwards;
}

@keyframes fadeIn{
    from{opacity:0; transform:scale(0.8);}
    to{opacity:1; transform:scale(1);}
}

h1{
    font-family:'Great Vibes',cursive;
    font-size:60px;
    margin-bottom:20px;
}

.typewriter{
    font-size:22px;
    margin-bottom:30px;
    min-height:30px;
}

button{
    padding:12px 30px;
    border:none;
    border-radius:30px;
    background:white;
    color:#ff4e88;
    font-weight:bold;
    cursor:pointer;
    transition:0.4s;
}

button:hover{
    background:#ffe6ec;
    transform:scale(1.1);
}

#proposal{
    margin-top:30px;
    font-size:28px;
    display:none;
    animation:zoom 1s ease forwards;
}

@keyframes zoom{
    from{transform:scale(0);}
    to{transform:scale(1);}
}

</style>
</head>
<body>

<div class="card">
    <h1>Happy Valentine Paathu ❤️</h1>
    <div class="typewriter" id="text"></div>
    <button onclick="showProposal()">Open My Heart 💌</button>
    <div id="proposal">
        💍 Paathu... Will You Be Mine Forever? ❤️
    </div>
</div>

<script>
/* Floating Hearts Generator */
for(let i=0;i<30;i++){
    let heart=document.createElement('div');
    heart.className='heart';
    heart.style.left=Math.random()*100+'vw';
    heart.style.animationDuration=(5+Math.random()*5)+'s';
    heart.style.opacity=Math.random();
    heart.style.transform='scale('+Math.random()*1.5+') rotate(45deg)';
    document.body.appendChild(heart);
}

/* Typewriter Effect */
const message="You are my heart, my happiness, my forever love 💖";
let i=0;
function typing(){
    if(i<message.length){
        document.getElementById("text").innerHTML += message.charAt(i);
        i++;
        setTimeout(typing,50);
    }
}
typing();

/* Proposal Reveal */
function showProposal(){
    document.getElementById("proposal").style.display="block";
}
</script>

</body>
</html>
